<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 인쇄용</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #eee; color: #111; }

  /* 화면에서만 보이는 설정 바 */
  #bar { position: sticky; top: 0; background: #fff; padding: 12px 16px; border-bottom: 1px solid #ccc; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 5; }
  #bar input { flex: 1; min-width: 260px; padding: 8px; font-size: 15px; }
  #bar button { padding: 8px 16px; font-size: 15px; }
  #bar small { width: 100%; color: #666; }

  .sheet { width: 210mm; height: 297mm; margin: 12px auto; background: #fff; padding: 12mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 6mm; }
  .item { border: 1px dashed #999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4mm; }
  .qr { width: 62mm; height: 62mm; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .empty { width: 62mm; height: 62mm; border: 2px dashed #999; display: flex; align-items: center; justify-content: center; color: #999; text-align: center; padding: 4mm; font-size: 10pt; }
  /* QR 아래 이름표: 점선 박스째로 잘라서 쓰고, 이름표 줄은 잘라내세요 */
  .cut { margin-top: 3mm; width: 100%; border-top: 1px dashed #888; text-align: center; padding-top: 2mm; font-size: 9pt; color: #666; word-break: break-all; }
  .cut b { color: #222; }

  @media print {
    body { background: #fff; }
    #bar { display: none; }
    .sheet { margin: 0; }
  }
</style>
</head>
<body>
<div id="bar">
  <input id="url" placeholder="1번 QR에 넣을 사이트 주소 (예: https://내프로젝트.pages.dev/)">
  <button id="save">적용</button>
  <button onclick="print()">🖨 인쇄</button>
  <small>1번 QR 주소를 넣고 적용 → 인쇄. 이 페이지를 배포된 사이트에서 열면 주소가 자동으로 들어갑니다. 인쇄할 때 여백은 "없음", 배율은 "100%"로 두세요. 점선 칸 하나씩 잘라 쓰고, 아래 이름표 줄은 잘라내세요.</small>
</div>
<div class="sheet" id="pages"></div>

<script src="../lib/qrcode.js"></script>
<script>
// 2번 이후는 stages.js 의 answerHash 와 짝이 맞는 글자입니다. (바꾸면 해시도 바꿔야 함)
const ITEMS = [
  { label: '1. 침대 쪽지 — 사이트 링크', url: true },
  { label: '2. 식탁',     text: 'memory-01' },
  { label: '3. 지하 5층 스토리지', text: 'memory-02' },
  { label: '4. 우편함',   text: 'memory-03' },
  { label: '5. 자동차 트렁크', text: 'memory-04' },
  { label: '6. 본넷',     text: 'memory-05' }
];

const $ = id => document.getElementById(id);
const KEY = 'anniv-qr-url';

function initialUrl() {
  const q = new URLSearchParams(location.search).get('url');
  if (q) return q;
  try { const v = localStorage.getItem(KEY); if (v) return v; } catch (e) {}
  if (/^https:/.test(location.protocol)) return location.origin + '/';
  return '';
}

function svgFor(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ scalable: true, margin: 4 });
}

function render() {
  const url = $('url').value.trim();
  $('pages').innerHTML = '';
  ITEMS.forEach(it => {
    const text = it.url ? url : it.text;
    const page = document.createElement('div');
    page.className = 'item';
    const box = document.createElement('div');
    if (text) { box.className = 'qr'; box.innerHTML = svgFor(text); }
    else { box.className = 'empty'; box.textContent = '위 칸에 사이트 주소를 입력하고 "적용"을 누르세요'; }
    const cut = document.createElement('div');
    cut.className = 'cut';
    cut.innerHTML = '✂ <b>' + it.label + '</b>' + '';
    page.append(box, cut);
    $('pages').append(page);
  });
}

$('url').value = initialUrl();
$('save').onclick = () => { try { localStorage.setItem(KEY, $('url').value.trim()); } catch (e) {} render(); };
render();
</script>
</body>
</html>
