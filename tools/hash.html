<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해시 생성기</title>
<style>
body { font-family:system-ui, sans-serif; max-width:560px; margin:30px auto; padding:0 16px; background:#0b0f14; color:#d7e3ea; }
input { width:100%; padding:12px; font-size:18px; box-sizing:border-box; }
pre { background:#121a22; padding:12px; border-radius:8px; word-break:break-all; white-space:pre-wrap; user-select:all; }
button { padding:10px 16px; font-size:16px; margin-top:8px; }
</style>
</head>
<body>
<h2>정답 → SHA-256 해시</h2>
<p>정답을 입력하면 trim + 소문자 변환 후 해시를 보여줍니다. (HTTPS 또는 localhost에서만 동작)</p>
<input id="in" placeholder="정답 입력" autofocus>
<pre id="out">(해시가 여기 표시됩니다)</pre>
<button id="copy">복사</button>
<script>
const $ = id => document.getElementById(id);
async function sha(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s.trim().toLowerCase()));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
$('in').addEventListener('input', async e => {
  $('out').textContent = e.target.value.trim() ? await sha(e.target.value) : '(해시가 여기 표시됩니다)';
});
$('copy').onclick = () => navigator.clipboard && navigator.clipboard.writeText($('out').textContent);
</script>
</body>
</html>
